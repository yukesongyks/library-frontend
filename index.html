<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>图书管理系统</h1>

    <!-- 新增/编辑表单 -->
    <div class="form-section">
        <h2 id="formTitle">新增图书</h2>
        <form id="bookForm">
            <input type="hidden" id="bookId">
            <div class="form-row">
                <label for="title">书名 <span class="required">*</span></label>
                <input type="text" id="title" maxlength="200" required>
            </div>
            <div class="form-row">
                <label for="author">作者 <span class="required">*</span></label>
                <input type="text" id="author" maxlength="100" required>
            </div>
            <div class="form-row">
                <label for="isbn">ISBN <span class="required">*</span></label>
                <input type="text" id="isbn" pattern="\d{10,13}" title="10到13位数字" required>
            </div>
            <div class="form-row">
                <label for="publisher">出版社</label>
                <input type="text" id="publisher" maxlength="200">
            </div>
            <div class="form-row">
                <label for="stock">库存 <span class="required">*</span></label>
                <input type="number" id="stock" min="0" value="0" required>
            </div>
            <div class="form-actions">
                <button type="submit" id="submitBtn">保存</button>
                <button type="button" id="resetBtn">重置</button>
            </div>
        </form>
    </div>

    <!-- 消息提示 -->
    <div id="message" class="message hidden"></div>

    <!-- 图书列表 -->
    <div class="table-section">
        <h2>图书列表</h2>
        <table id="bookTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>书名</th>
                <th>作者</th>
                <th>ISBN</th>
                <th>出版社</th>
                <th>库存</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="bookTableBody">
            </tbody>
        </table>
        <div class="pagination">
            <button id="prevBtn" onclick="prevPage()">上一页</button>
            <span id="pageInfo"></span>
            <button id="nextBtn" onclick="nextPage()">下一页</button>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
